name: Build PIXL Renderer (test DLL)

# Builds PIXLRenderer.dll and the Core package on every push, and on demand
# from the Actions tab ("Run workflow"). Download the result from the run's
# "Artifacts" section.
on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 300
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      # Windows runners default to core.autocrlf=true, which rewrites the vcpkg
      # overlay-port and FidelityFX .patch files to CRLF and makes them "corrupt".
      - name: Keep checkout line endings as committed
        run: git config --global core.autocrlf false

      - name: Check out source and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install current CMake
        shell: pwsh
        run: |
          py -m pip install --disable-pip-version-check --upgrade "cmake>=4.2"
          # The runner ships an older CMake earlier on PATH; PIXL's presets need 4.2+.
          $scripts = py -c "import sysconfig; print(sysconfig.get_path('scripts'))"
          $scripts | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Show CMake version
        run: cmake --version

      - name: Set up vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      - name: Restore vcpkg package cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}\vcpkg-binary-cache
          key: vcpkg-${{ hashFiles('vcpkg.json', 'cmake/ports/**', 'cmake/triplets/**') }}
          restore-keys: vcpkg-

      - name: Configure
        run: cmake -S . --preset=ALL

      # Save built dependencies even if a later step fails, so retries skip them.
      - name: Save vcpkg package cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}\vcpkg-binary-cache
          key: vcpkg-${{ hashFiles('vcpkg.json', 'cmake/ports/**', 'cmake/triplets/**') }}

      - name: Build DLL and Core package
        run: cmake --build --preset=Package

      # Upload the DLL even if the audit/packaging that runs after linking fails.
      - name: Upload PIXLRenderer.dll
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PIXLRenderer-dll-${{ github.sha }}
          path: |
            build/ALL/**/PIXLRenderer.dll
            build/ALL/**/PIXLRenderer.pdb
          if-no-files-found: warn

      - name: Upload Core package
        uses: actions/upload-artifact@v4
        with:
          name: PIXL-Core-package-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: warn
